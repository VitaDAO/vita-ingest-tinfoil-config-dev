# Tinfoil Container Configuration - vita-ingest development debug
#
# PUBLIC REPOSITORY. Never commit secret values here.
# Based on staging release v0.1.4, isolated from staging and production releases.

cvm-version: 0.7.5
cpus: 2
memory: 4096

containers:
  - name: vita-ingest
    image: "ghcr.io/vitadao/vita-ingest:sha-ea18924@sha256:7ac15216a00aa320f72e820a83b767191f9be5d3f5fab442bda8680b1ed1a96e"
    registry:
      username: DobrinAlexandru
      password_secret: VITA_INGEST_GHCR_TOKEN

    env:
      - PORT: "8080"
      - TINFOIL_PUBLIC_URL: "https://vita-ingest-dev.debug.vitality-now.containers.tinfoil.dev"
      - VITA_INGEST_CORS_ORIGINS: "http://localhost:8080,https://staging-app.vitadao.com"
      - TINFOIL_LAB_TEXT_MODEL: "gemma4-31b"
      - SENTRY_ENVIRONMENT: "staging"
      - SENTRY_RELEASE: "pr356@ea189241aa84eeb621bea509488d03f8d134f32f"
      - VITA_INGEST_VERSION: "pr356@ea189241aa84eeb621bea509488d03f8d134f32f"
      - VITA_ANALYTICS_ENVIRONMENT: "staging"
      - SENTRY_TRACES_SAMPLE_RATE: "0"
      - DEFAULT_FRONTEND_URL: "http://localhost:8080"
      - ALLOWED_REDIRECT_ORIGINS: "http://localhost:8080,https://staging-app.vitadao.com"

    secrets:
      - VITA_INGEST_GHCR_TOKEN

      # Staging data plane. The runtime aliases these names onto the unprefixed
      # names used internally; production credentials are never mounted.
      - STAGING_SUPABASE_URL
      - STAGING_SUPABASE_PUBLISHABLE_KEY
      - STAGING_SUPABASE_SECRET_KEY
      - STAGING_CONNECTION_TOKEN_KEK

      - TINFOIL_API_KEY
      - SENTRY_DSN

      - OURA_CLIENT_ID
      - OURA_CLIENT_SECRET
      - WHOOP_CLIENT_ID
      - WHOOP_CLIENT_SECRET
      - WITHINGS_CLIENT_ID
      - WITHINGS_CLIENT_SECRET

      # Anonymous, telemetry-only staging project key.
      - POSTHOG_STAGING_PROJECT_KEY

shim:
  upstream-port: 8080
  paths:
    - /health
    - /api/parse-lab-results
    - /api/summarize-screening-report
    - /api/wearable/oura/auth
    - /api/wearable/oura/callback
    - /api/wearable/oura/fetch
    - /api/wearable/whoop/auth
    - /api/wearable/whoop/callback
    - /api/wearable/whoop/fetch
    - /api/wearable/whoop/sync
    - /api/wearable/withings/auth
    - /api/wearable/withings/callback
    - /api/wearable/withings/fetch
