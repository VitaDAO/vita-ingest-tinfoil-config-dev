name: Tinfoil Release

run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v0.0.1)"
        required: true
        type: string

concurrency:
  group: tinfoil-container-release-${{ inputs.version }}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: true

      - name: Check if version tag already exists
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      - name: Verify development isolation
        run: |
          set -euo pipefail
          grep -q 'vita-ingest-dev.debug.vitality-now.containers.tinfoil.dev' tinfoil-config.yml
          grep -q 'STAGING_SUPABASE_URL' tinfoil-config.yml
          grep -q 'STAGING_SUPABASE_SECRET_KEY' tinfoil-config.yml
          grep -q 'STAGING_CONNECTION_TOKEN_KEK' tinfoil-config.yml
          grep -q 'pr277@420e816de77a67aef11b2d77aa2a9c472c7f46df' tinfoil-config.yml
          grep -q 'image: "ghcr.io/vitadao/vita-ingest:sha-420e816@sha256:c6abd0bf595dfdad98e28be5a7f6144fd247a47f13ee5e26088a7cf6c46db471"' tinfoil-config.yml
          if grep -Eq '(^|[^A-Z_])(SUPABASE_SERVICE_ROLE_KEY|CONNECTION_TOKEN_KEK)([^A-Z_]|$)' tinfoil-config.yml; then
            echo "::error::Refusing production secret names in the development manifest"
            exit 1
          fi

      - name: Create and push the release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"

      - name: Dispatch the publish workflow on the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: gh workflow run tinfoil-release-publish.yml --ref "$VERSION"
